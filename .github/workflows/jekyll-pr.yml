name: Build Jekyll site for Pull Requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development environment
        run: docker build -t rl337-dev .
      - name: Build production site
        run: ./docker-run.sh bash -c 'cd docs && bundle install && JEKYLL_ENV=production bundle exec jekyll build --strict_front_matter --trace'
