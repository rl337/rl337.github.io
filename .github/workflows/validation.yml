name: Validation Pipeline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development environment
        run: docker build -t rl337-dev .
      - name: Run all required checks
        run: ./docker-run.sh ./run_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: scripts/coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: docs/_site/
  jekyll-build:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-preview
          path: site
      - name: Verify validated production artifact
        run: docker run --rm -v "$PWD/site:/site:ro" alpine:latest sh -c 'test -s /site/index.html && test -s /site/archives/index.html && test -s /site/assets/main.css'
