<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">Richard Lee<span>rl337.org</span></a>
    <nav aria-label="Main navigation">
      {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
      {% endfor %}
      <a href="{{ site.substack_url }}">Substack</a>
    </nav>
  </div>
</header>
