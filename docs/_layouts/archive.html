---
layout: page
---
<ul class="post-list">
{% for post in page.posts %}
  <li>
    <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%b %-d, %Y" }}</time>
    <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
  </li>
{% endfor %}
</ul>
<p><a href="{{ '/archives/' | relative_url }}">Browse all posts</a></p>
