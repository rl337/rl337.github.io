---
layout: page
---
<ul class="writing-list">
{% for post in page.posts %}
  <li><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2></li>
{% endfor %}
</ul>
<p><a href="{{ '/archives/' | relative_url }}">Browse all posts</a></p>
